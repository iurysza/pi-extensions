version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      earendil-works:
        patterns:
          - "@earendil-works/*"
        update-types:
          - major
          - minor
          - patch
      npm-patch-and-minor:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@earendil-works/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions-patch-and-minor:
        update-types:
          - minor
          - patch
