version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      earendil-works:
        patterns:
          - "@earendil-works/*"
        update-types:
          - major
          - minor
          - patch
      npm-patch-and-minor:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@earendil-works/*"
    ignore:
      # TypeScript 7 ships the native compiler. Its package entry is lib/version
      # and does not export the JS compiler API the startup import-graph tests import.
      - dependency-name: typescript
        versions:
          - ">=7"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions-patch-and-minor:
        update-types:
          - minor
          - patch
