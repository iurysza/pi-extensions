name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

# main does not require status checks, so `gh pr merge --auto` would squash
# before CI finishes. This workflow waits for .github/workflows/ci.yml.
permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave semver-major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: echo "Skipping ${UPDATE_TYPE}."

      - name: Leave unrecognized update types for review
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.metadata.outputs.update-type != 'version-update:semver-minor' && steps.metadata.outputs.update-type != 'version-update:semver-patch'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: echo "Update type '${UPDATE_TYPE}' is not a minor or patch update. Skipping auto-merge."

      - name: Squash-merge after CI succeeds
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          echo "Waiting for CI on ${SHA} (${UPDATE_TYPE})."
          deadline=$((SECONDS + 2700))

          while true; do
            head=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
            if [[ "$head" != "$SHA" ]]; then
              echo "Head moved from ${SHA} to ${head}. A newer run will handle it."
              exit 0
            fi

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for CI."
              exit 1
            fi

            state=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=pull_request&per_page=1" \
              --jq 'if (.workflow_runs | length) == 0 then "missing" else .workflow_runs[0].status + ":" + (.workflow_runs[0].conclusion // "") end')
            echo "CI: ${state}"

            case "$state" in
              completed:success)
                break
                ;;
              completed:*)
                echo "CI finished without success (${state})."
                exit 1
                ;;
              *)
                sleep 20
                ;;
            esac
          done

          gh pr merge --squash --match-head-commit "$SHA" "$PR_URL"
